<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Melissa & Badr Eddine</title>

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Pinyon+Script&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #565b4b;
            color: #f4f0e5;
            font-family: "Cormorant Garamond", Georgia, serif;
        }

        .invitation {
            width: 100%;
            min-height: 100svh;

            display: flex;
            justify-content: center;
        }

        .invitation-content {
            width: min(100%, 480px);
            min-height: 100svh;

            position: relative;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding:
                clamp(70px, 11vh, 120px)
                35px
                clamp(50px, 8vh, 90px);
        }


        /* -------------------------
           PARENTS
        ------------------------- */

        .parents {
            font-size: clamp(20px, 2.6vw, 27px);
            font-weight: 400;
            text-align: center;

            line-height: 1.2;

            margin-bottom: clamp(70px, 9vh, 100px);
        }


        /* -------------------------
           INVITATION TEXT
        ------------------------- */

        .intro {
            max-width: 90%;

            font-size: clamp(22px, 3vw, 29px);
            font-weight: 400;

            text-align: center;
            line-height: 1.25;

            margin-bottom: clamp(65px, 8vh, 90px);
        }


        /* -------------------------
           NAMES
        ------------------------- */

        .names {
            display: flex;
            flex-direction: column;
            align-items: center;

            margin-bottom: clamp(65px, 8vh, 90px);
        }

        .name {
            font-family: "Pinyon Script", cursive;

            font-size: clamp(75px, 12vw, 110px);
            font-weight: 400;

            line-height: 0.85;

            white-space: nowrap;
        }

        .with {
            font-family: "Cormorant Garamond", Georgia, serif;

            font-size: clamp(23px, 3vw, 28px);
            font-weight: 400;

            margin: 20px 0;
        }


        /* -------------------------
           DATE SECTION
        ------------------------- */

        .date-section {
            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            margin-bottom: clamp(65px, 8vh, 90px);
        }

        .celebration {
            font-size: clamp(22px, 3vw, 28px);

            margin-bottom: 55px;
        }

        .date {
            font-size: clamp(29px, 4vw, 42px);
            font-weight: 600;

            line-height: 1.1;

            margin-bottom: 45px;
        }

        .time {
            font-size: clamp(22px, 3vw, 28px);
        }


        /* -------------------------
           LOCATION
        ------------------------- */

        .location {
            text-align: center;

            font-size: clamp(21px, 2.8vw, 27px);
            font-weight: 300;

            line-height: 1.25;

            margin-top: auto;
        }

        .location-name {
            font-weight: 400;
        }


        /* -------------------------
           SMALL PHONES
        ------------------------- */

        @media (max-height: 700px) {

            .invitation-content {
                padding-top: 50px;
                padding-bottom: 40px;
            }

            .parents {
                margin-bottom: 45px;
            }

            .intro {
                margin-bottom: 45px;
            }

            .names {
                margin-bottom: 45px;
            }

            .name {
                font-size: 75px;
            }

            .date-section {
                margin-bottom: 45px;
            }

            .celebration {
                margin-bottom: 30px;
            }

            .date {
                margin-bottom: 25px;
            }
        }
    </style>
</head>


<body>

<section class="invitation">

    <div class="invitation-content">

        <!-- Parents -->
        <p class="parents">
            Madame et Monsieur Ould Braham
        </p>


        <!-- Invitation -->
        <p class="intro">
            ont la joie et l'honneur<br>
            de vous inviter au mariage de leur fille
        </p>


        <!-- Mariés -->
        <div class="names">

            <div class="name">
                Melissa
            </div>

            <div class="with">
                avec
            </div>

            <div class="name">
                Badr Eddine
            </div>

        </div>


        <!-- Date -->
        <div class="date-section">

            <p class="celebration">
                qui sera célébré le
            </p>

            <p class="date">
                Samedi 12 décembre 2026
            </p>

            <p class="time">
                à 14:30
            </p>

        </div>


        <!-- Lieu -->
        <div class="location">

            <p class="location-name">
                à la salle Hamza
            </p>

            <p>
                Dely Ibrahim, Alger
            </p>

        </div>

    </div>

</section>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melissa &amp; Badr Eddine — Mariage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#FAF1E1;
    --ink:#565B4A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:#000;
    overflow-x:hidden;
  }
  body.locked{overflow:hidden; height:100vh;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* ================= VIDEO ENVELOPE SCREEN (fullscreen intro) ================= */
  #envelope-screen{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#EDE6D5 url('assets/envelope-poster.jpg') center/cover no-repeat;
    cursor:pointer;
  }
  #envelope-screen.hidden{ display:none; }
  #envelope-video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
  }
  .tap-hint{
    position:absolute;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:#FBF8F1;
    text-shadow:0 2px 8px rgba(0,0,0,0.4);
    opacity:0.9;
    animation:pulse 2.2s ease-in-out infinite;
    pointer-events:none;
  }
  #envelope-screen.playing .tap-hint{ display:none; }
  @keyframes pulse{ 0%,100%{opacity:0.5;} 50%{opacity:1;} }

  /* ================= FIXED-CANVAS PAGES (each artboard = 1080x1920) ================= */
  .page{
    position:relative;
    width:100%;
    max-width:1080px;
    aspect-ratio:1080/1920;
    margin:0 auto;
    overflow:hidden;
    container-type:inline-size;
  }

  /* --- Page 1: static reveal frame (matches the video's final frame) --- */
  #hero{
    background:#5C6650 url('assets/invite-reveal.jpg') center/cover no-repeat;
  }
  .scroll-cue{
    position:absolute;
    left:50%;
    bottom:5%;
    transform:translateX(-50%);
    color:#D6BD8C;
    text-shadow:0 2px 8px rgba(0,0,0,0.35);
    font-size:2.2cqw;
    letter-spacing:0.2em;
    text-transform:uppercase;
    font-family:'Montserrat', sans-serif;
    animation:bob 2.4s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateX(-50%) translateY(0);}
    50%{transform:translateX(-50%) translateY(6px);}
  }

  /* --- Page 2: map page, built from real HTML text + graphic --- */
  #map-page{
    background:var(--page-bg);
  }
  #map-page .map-graphic{
    position:absolute;
    left:50%;
    top:8.3333%;
    width:39.8148%;
    height:auto;
    display:block;
  }
  #map-page .label{
    position:absolute;
    left:10%;
    right:6%;
    color:var(--ink);
  }
  #map-page .map-title{
    top:13.0208%;
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:4.6296cqw;
    line-height:1.1;
  }
  #map-page .map-venue{
    top:20.8333%;
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-size:2.963cqw;
  }
  #map-page .map-address{
    top:27.0833%;
    display:flex;
    align-items:flex-start;
    gap:1.1cqw;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:400;
    font-size:2.3148cqw;
    line-height:1.35;
  }
  #map-page .map-address svg{
    width:2.4cqw;
    height:2.4cqw;
    flex-shrink:0;
    margin-top:0.3cqw;
    fill:var(--ink);
  }
  #map-page .maps-link{
    top:36.4583%;
    font-family:'Montserrat', sans-serif;
    font-weight:500;
    font-size:2.3148cqw;
    letter-spacing:0.04em;
    text-decoration:none;
    color:var(--ink);
    display:inline-block;
    cursor:pointer;
    transition:opacity 0.2s ease;
  }
  #map-page .maps-link:hover{
    opacity:0.65;
    text-decoration:underline;
  }
</style>
</head>
<body class="locked">

<!-- ===================== VIDEO ENVELOPE SCREEN ===================== -->
<div id="envelope-screen">
  <video id="envelope-video" src="assets/envelope-animation.mp4" poster="assets/envelope-poster.jpg" muted playsinline preload="auto"></video>
  <div class="tap-hint">Cliquez pour ouvrir</div>
</div>

<!-- ===================== PAGE 1 : HERO / INVITATION REVEAL ===================== -->
<section class="page" id="hero">
  <div class="scroll-cue">Faites défiler ↓</div>
</section>

<!-- ===================== PAGE 2 : MAP PAGE ===================== -->
<section class="page" id="map-page">
  <img class="map-graphic" src="assets/map-graphic.png" alt="Plan d'accès">

  <div class="label map-title">Retrouvez-nous</div>

  <div class="label map-venue">Salle Hamza</div>

  <div class="label map-address">
    <svg viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.6 4 10c0 5.4 7 11.5 7.3 11.8.2.1.4.2.7.2s.5-.1.7-.2C13 21.5 20 15.4 20 10c0-4.4-3.6-8-8-8zm0 11c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3z"/></svg>
    <span>14 rue Ahmed Ouaked<br>Dely Ibrahim, Alger</span>
  </div>

  <a class="label maps-link" href="https://maps.app.goo.gl/XSvzecsYN35hYMBC9" target="_blank" rel="noopener">Ouvrir maps</a>
</section>

<script>
  const video = document.getElementById('envelope-video');
  const envScreen = document.getElementById('envelope-screen');
  const body = document.body;
  let hasOpened = false;

  video.addEventListener('loadeddata', () => {
    video.currentTime = 0;
    video.pause();
  });

  envScreen.addEventListener('click', () => {
    if(hasOpened) return;
    hasOpened = true;
    envScreen.classList.add('playing');
    video.play();
  });

  video.addEventListener('ended', () => {
    envScreen.classList.add('hidden');
    body.classList.remove('locked');
    document.getElementById('hero').scrollIntoView({behavior:'auto'});
  });
</script>

</body>
</html>

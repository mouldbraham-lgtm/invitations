<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melissa &amp; Badr Eddine — Mariage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&family=Montserrat:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#8CA084;
    --sage-deep:#5C7350;
    --sage-dark:#3E4F36;
    --beige:#F3ECDF;
    --beige-deep:#E7DCC6;
    --cream:#FBF8F1;
    --gold:#B8965A;
    --gold-light:#D6BD8C;
    --ink:#3A3F34;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Jost', sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#F3ECDF 0%, #EDF1E6 100%);
    overflow-x:hidden;
  }
  body.locked{overflow:hidden; height:100vh;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* ================= VIDEO ENVELOPE SCREEN ================= */
  #envelope-screen{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#EDE6D5 url('assets/envelope-poster.jpg') center/cover no-repeat;
    cursor:pointer;
  }
  #envelope-screen.hidden{
    display:none;
  }
  #envelope-video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
  }
  .tap-hint{
    position:absolute;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--cream);
    text-shadow:0 2px 8px rgba(0,0,0,0.4);
    opacity:0.9;
    animation:pulse 2.2s ease-in-out infinite;
    pointer-events:none;
  }
  #envelope-screen.playing .tap-hint{
    display:none;
  }
  @keyframes pulse{
    0%,100%{opacity:0.5;}
    50%{opacity:1;}
  }

  /* ================= SCROLL CONTENT ================= */
  section{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
  }

  /* --- Hero / invitation reveal (static image, matches video's last frame) --- */
  #hero{
    background:#5C6650 url('assets/invite-reveal.jpg') center/cover no-repeat;
  }
  .scroll-cue{
    color:var(--gold-light);
    text-shadow:0 2px 8px rgba(0,0,0,0.35);
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    animation:bob 2.4s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateX(-50%) translateY(0);}
    50%{transform:translateX(-50%) translateY(6px);}
  }

  /* --- Map page: image as background, link floats on top without covering anything --- */
  #map-page{
    background:#F3ECDF url('assets/map-page.jpg') center/cover no-repeat;
  }
  #maps-link{
    position:absolute;
    left:10%;
    top:36.7188%;
    transform:translate(0,-50%);
    font-family:'Montserrat', sans-serif;
    font-weight:500;
    font-size:20px;
    letter-spacing:0.04em;
    color:var(--sage-dark);
    text-decoration:none;
    cursor:pointer;
    transition:opacity 0.2s ease;
  }
  #maps-link:hover{
    opacity:0.7;
    text-decoration:underline;
  }
</style>
</head>
<body class="locked">

<!-- ===================== VIDEO ENVELOPE SCREEN ===================== -->
<div id="envelope-screen">
  <video id="envelope-video" src="assets/envelope-animation.mp4" poster="assets/envelope-poster.jpg" muted playsinline preload="auto"></video>
  <div class="tap-hint">Cliquez pour ouvrir</div>
</div>

<!-- ===================== HERO / INVITATION ===================== -->
<section id="hero">
  <div class="scroll-cue">Faites défiler ↓</div>
</section>

<!-- ===================== MAP PAGE ===================== -->
<section id="map-page">
  <a id="maps-link" href="https://www.google.com/maps/search/?api=1&query=Salle+Hamza+Dely+Ibrahim+Alger" target="_blank" rel="noopener">OUVRIR MAPS</a>
</section>

<script>
  const video = document.getElementById('envelope-video');
  const envScreen = document.getElementById('envelope-screen');
  const body = document.body;
  let hasOpened = false;

  // Show the closed envelope as a still first frame
  video.addEventListener('loadeddata', () => {
    video.currentTime = 0;
    video.pause();
  });

  envScreen.addEventListener('click', () => {
    if(hasOpened) return;
    hasOpened = true;
    envScreen.classList.add('playing');
    video.play();
  });

  video.addEventListener('ended', () => {
    envScreen.classList.add('hidden');
    body.classList.remove('locked');
    document.getElementById('hero').scrollIntoView({behavior:'auto'});
  });
</script>

</body>
</html>

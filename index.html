<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Melissa & Badr Eddine</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Pinyon+Script&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #565b4b;
            color: #f4f0e5;
            font-family: "Cormorant Garamond", serif;
        }

        .invitation {
            min-height: 100svh;
            width: 100%;

            display: flex;
            justify-content: center;
        }

        .invitation-content {
            width: 100%;
            max-width: 430px;

            min-height: 100svh;

            padding: 75px 35px 60px;

            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }


        /* PARENTS */

        .parents {
            font-size: 21px;
            font-weight: 400;
            line-height: 1.2;

            margin-bottom: 82px;
        }


        /* INTRO */

        .intro {
            font-size: 23px;
            font-weight: 400;
            line-height: 1.2;

            max-width: 350px;

            margin-bottom: 72px;
        }


        /* NAMES */

        .names {
            display: flex;
            flex-direction: column;
            align-items: center;

            margin-bottom: 75px;
        }

        .name {
            font-family: "Pinyon Script", cursive;

            font-size: 76px;
            font-weight: 400;

            line-height: 0.82;

            white-space: nowrap;
        }

        .with {
            font-size: 22px;
            line-height: 1;

            margin: 18px 0;
        }


        /* DATE */

        .date-section {
            display: flex;
            flex-direction: column;
            align-items: center;

            margin-bottom: 70px;
        }

        .celebration {
            font-size: 22px;
            line-height: 1.2;

            margin-bottom: 48px;
        }

        .date {
            font-size: 32px;
            font-weight: 600;
            line-height: 1.1;

            margin-bottom: 38px;

            white-space: nowrap;
        }

        .time {
            font-size: 22px;
        }


        /* LOCATION */

        .location {
            font-size: 21px;
            font-weight: 300;
            line-height: 1.2;
        }

        .location-name {
            margin-bottom: 3px;
        }


        /* SMALL PHONES */

        @media (max-width: 360px) {

            .invitation-content {
                padding-left: 25px;
                padding-right: 25px;
            }

            .parents {
                font-size: 19px;
                margin-bottom: 65px;
            }

            .intro {
                font-size: 21px;
                margin-bottom: 60px;
            }

            .name {
                font-size: 66px;
            }

            .with {
                font-size: 20px;
                margin: 15px 0;
            }

            .names {
                margin-bottom: 62px;
            }

            .celebration {
                font-size: 20px;
                margin-bottom: 38px;
            }

            .date {
                font-size: 28px;
            }

            .time {
                font-size: 20px;
            }

            .location {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<section class="invitation">

    <div class="invitation-content">

        <p class="parents">
            Madame et Monsieur Ould Braham
        </p>


        <p class="intro">
            ont la joie et l'honneur<br>
            de vous inviter au mariage de leur fille
        </p>


        <div class="names">

            <div class="name">
                Melissa
            </div>

            <div class="with">
                avec
            </div>

            <div class="name">
                Badr Eddine
            </div>

        </div>


        <div class="date-section">

            <p class="celebration">
                qui sera célébré le
            </p>

            <p class="date">
                Samedi 12 décembre 2026
            </p>

            <p class="time">
                à 14:30
            </p>

        </div>


        <div class="location">

            <p class="location-name">
                à la salle Hamza
            </p>

            <p>
                Dely Ibrahim, Alger
            </p>

        </div>

    </div>

</section>

</body>
</html>
